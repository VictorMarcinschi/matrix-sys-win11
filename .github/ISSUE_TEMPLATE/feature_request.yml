name: Feature request
description: Something MatrixSys could show or do.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe what you want to see or do, and why it would help you.
    validations:
      required: true
  - type: dropdown
    id: tab
    attributes:
      label: Where does it belong?
      multiple: true
      options: [Processes, Network, Files, Disks, Devices, Memory, Trace, New tab, Installer or service, Not sure]
  - type: textarea
    id: alternatives
    attributes:
      label: How do you do this today?
      description: Another tool, a command, a workaround.
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I would like to work on this myself.
